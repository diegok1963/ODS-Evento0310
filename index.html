<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Orden del Sol - Reservas</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", sans-serif; background: #2D3436; color: #fff; min-height: 100vh; }
header { background: rgb(0,35,102); padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 1.3rem; font-weight: 800; color: #fff; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
.toolbar input { flex: 1; min-width: 200px; padding: 9px 14px; border-radius: 10px; border: 1px solid #555; background: #3D4446; color: #fff; font-size: .9rem; outline: none; }
.btn { padding: 9px 16px; border-radius: 10px; font-size: .82rem; font-weight: 600; cursor: pointer; border: none; }
.btn-primary { background: linear-gradient(135deg,#c026d3,#7c3aed); color: #fff; }
.btn-excel { background: rgba(34,197,94,.15); border: 1px solid rgba(34,197,94,.5); color: #4ade80; }
.btn-import { background: rgba(6,182,212,.15); border: 1px solid rgba(6,182,212,.5); color: #22d3ee; }
.btn-pdf { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.5); color: #f87171; }
.btn-repr { background: rgba(245,158,11,.15); border: 1px solid rgba(245,158,11,.5); color: #f59e0b; }
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(300px,1fr)); gap: 16px; }
.card { background: #fff; border-radius: 14px; overflow: hidden; }
.card-top { background: #3D4446; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
.card-top span { color: #fff; font-weight: 700; font-size: .85rem; }
.card-body { padding: 12px 16px; }
.card-btns { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 16px 12px; border-top: 1px solid #e5e7eb; background: #f9fafb; }
.btn-sm { padding: 5px 10px; font-size: .76rem; border-radius: 7px; }
.btn-info { background: rgba(6,182,212,.15); border: 1px solid rgba(6,182,212,.5); color: #000; }
.btn-wa { background: rgba(37,211,102,.15); border: 1px solid rgba(37,211,102,.5); color: #25d366; }
.btn-edit { background: rgba(34,197,94,.15); border: 1px solid rgba(34,197,94,.5); color: #000; }
.btn-cancel { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.5); color: #000; }
.btn-del { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.5); color: #000; }
.persona-row { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; margin-bottom: 3px; font-size: .82rem; }
.persona-row.abono { background: rgba(34,197,94,.15); border-left: 3px solid #22c55e; }
.persona-row.no-abono { background: rgba(239,68,68,.1); border-left: 3px solid #ef4444; }
.btn-estado { padding: 2px 8px; font-size: .72rem; border-radius: 6px; cursor: pointer; border: none; font-weight: 600; }
.btn-success { background: rgba(34,197,94,.15); border: 1px solid rgba(34,197,94,.4); color: #16a34a; }
.btn-warning { background: rgba(245,158,11,.15); border: 1px solid rgba(245,158,11,.4); color: #d97706; }
.btn-abono { font-size: .62rem; padding: 1px 5px; border-radius: 4px; cursor: pointer; border: none; font-weight: 600; color: #000; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: #3D4446; border: 1px solid #555; border-radius: 16px; width: 100%; max-width: 520px; }
.modal-header { padding: 16px 20px; border-bottom: 1px solid #555; display: flex; align-items: center; justify-content: space-between; }
.modal-header h2 { font-size: 1rem; font-weight: 700; }
.modal-close { background: none; border: none; color: #9ca3af; font-size: 1.2rem; cursor: pointer; }
.modal-body { padding: 16px 20px; }
.modal-footer { padding: 12px 20px; border-top: 1px solid #555; display: flex; gap: 10px; justify-content: flex-end; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: .74rem; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; background: #fff; border: 1px solid #74B9FF; border-radius: 8px; padding: 9px 12px; color: #111; font-size: .88rem; outline: none; font-family: inherit; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
#toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast { background: #3D4446; border: 1px solid #555; border-radius: 10px; padding: 10px 14px; font-size: .85rem; min-width: 220px; }
.toast.success { border-left: 4px solid #22c55e; }
.toast.error { border-left: 4px solid #ef4444; }
.toast.info { border-left: 4px solid #74B9FF; }
.empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; }
</style>
</head>
<body>
<header>
  <div style="font-size:2rem">&#127908;</div>
  <div>
    <h1>Asociación de Promociones "Orden del Sol"</h1>
    <p style="font-size:.75rem;color:#9ca3af;letter-spacing:2px;text-transform:uppercase">Administrador de Reservas</p>
  </div>
  <div style="margin-left:auto;display:flex;gap:10px;align-items:center">
    <button class="btn btn-repr" onclick="openRepresentantes()">&#128100; Representantes</button>
    <button class="btn btn-primary" onclick="openModal()">+ Nueva Reserva</button>
  </div>
</header>

<div class="container">
  <div class="toolbar">
    <input type="text" id="search-input" placeholder="Buscar por nombre, teléfono, liceo, promoción..." oninput="renderTable()"/>
    <button class="btn btn-import" id="btn-import">&#128229; Importar Excel</button>
    <input type="file" id="imp" accept=".xlsx,.xls" style="display:none"/>
    <button class="btn btn-excel" onclick="exportExcel()">&#128202; Exportar Excel</button>
    <button class="btn btn-pdf" onclick="exportPDF()">&#128196; Exportar PDF</button>
  </div>
  <div id="cards" class="cards-grid"></div>
</div>

<!-- MODAL NUEVA/EDITAR RESERVA -->
<div class="modal-overlay" id="modal-form" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Nueva Reserva</h2>
      <button class="modal-close" onclick="closeModal()">&#10005;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Liceo *</label>
        <select id="f-liceo" onchange="if(this.value==='Ninguno'){document.getElementById('f-nropromocion').value='0'}">
          <option value="">-- Seleccioná un Liceo --</option>
          <option>Liceo Militar Gral. San Martín</option>
          <option>Liceo Militar Gral. Roca</option>
          <option>Liceo Militar Gral. Espejo</option>
          <option>Liceo Militar Gral. Belgrano</option>
          <option>Liceo Militar Gral. Araoz de Lamadrid</option>
          <option>Liceo Aeronáutico Militar</option>
          <option>Liceo Naval Militar Alte. Brown</option>
          <option>Liceo Naval Militar Alte. Storni</option>
          <option>Liceo Naval Militar Dr. F. de Gurruchaga</option>
          <option>Liceo Naval Militar CF. Moyano</option>
          <option>Ninguno</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Nro. Promoción *</label>
          <select id="f-nropromocion">
            <option value="">-- Nro --</option>
            <option value="0">0</option>
            <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option><option value="32">32</option><option value="33">33</option><option value="34">34</option><option value="35">35</option><option value="36">36</option><option value="37">37</option><option value="38">38</option><option value="39">39</option><option value="40">40</option><option value="41">41</option><option value="42">42</option><option value="43">43</option><option value="44">44</option><option value="45">45</option><option value="46">46</option><option value="47">47</option><option value="48">48</option><option value="49">49</option><option value="50">50</option><option value="51">51</option><option value="52">52</option><option value="53">53</option><option value="54">54</option><option value="55">55</option><option value="56">56</option><option value="57">57</option><option value="58">58</option><option value="59">59</option><option value="60">60</option><option value="61">61</option><option value="62">62</option><option value="63">63</option><option value="64">64</option><option value="65">65</option><option value="66">66</option><option value="67">67</option><option value="68">68</option><option value="69">69</option><option value="70">70</option><option value="71">71</option><option value="72">72</option><option value="73">73</option><option value="74">74</option><option value="75">75</option><option value="76">76</option><option value="77">77</option><option value="78">78</option><option value="79">79</option><option value="80">80</option><option value="81">81</option><option value="82">82</option><option value="83">83</option><option value="84">84</option><option value="85">85</option><option value="86">86</option><option value="87">87</option>
          </select>
        </div>
        <div class="form-group">
          <label>Nombre y Apellido *</label>
          <input type="text" id="f-nombre" placeholder="Ej: María González"/>
        </div>
      </div>
      <div class="form-group"><label>Teléfono</label><input type="tel" id="f-telefono" placeholder="Ej: 11 5555-5555"/></div>
      <div class="form-group">
        <label>Familia / Amigos (separados por coma)</label>
        <textarea id="f-amigos" rows="3" placeholder="Ej: Juan García, Ana López"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" style="background:transparent;border:1px solid #555;color:#9ca3af" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveReserva()">&#128190; Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL CONFIRMAR ELIMINAR -->
<div class="modal-overlay" id="modal-confirm" onclick="if(event.target===this)closeConfirm()">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <h2>Confirmar eliminación</h2>
      <button class="modal-close" onclick="closeConfirm()">&#10005;</button>
    </div>
    <div class="modal-body" style="text-align:center;padding:24px">
      <div style="font-size:2.5rem;margin-bottom:10px">&#128465;&#65039;</div>
      <h3 style="margin-bottom:8px">¿Eliminar esta reserva?</h3>
      <p id="confirm-desc" style="color:#9ca3af;font-size:.85rem">Esta acción no se puede deshacer.</p>
    </div>
    <div class="modal-footer">
      <button class="btn" style="background:transparent;border:1px solid #555;color:#9ca3af" onclick="closeConfirm()">Cancelar</button>
      <button class="btn" style="background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.5);color:#f87171" onclick="confirmDelete()">&#128465; Eliminar</button>
    </div>
  </div>
</div>

<!-- MODAL REPRESENTANTES -->
<div class="modal-overlay" id="modal-representantes" onclick="if(event.target===this)closeRepresentantes()">
  <div class="modal" style="max-width:650px">
    <div class="modal-header">
      <h2>&#128100; Representantes</h2>
      <button class="modal-close" onclick="closeRepresentantes()">&#10005;</button>
    </div>
    <div class="modal-body" style="max-height:70vh;overflow-y:auto">
      <div style="background:#2D3436;border:1px solid #555;border-radius:10px;padding:14px;margin-bottom:14px">
        <div style="font-size:.72rem;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px" id="repr-form-title">Nuevo Representante</div>
        <div class="form-row">
          <div class="form-group" style="margin-bottom:10px">
            <label>Liceo *</label>
            <select id="r-liceo" style="background:#fff;color:#111;border:1px solid #74B9FF;border-radius:8px;padding:8px;width:100%;outline:none">
              <option value="">-- Seleccioná --</option>
              <option>Liceo Militar Gral. San Martín</option>
              <option>Liceo Militar Gral. Roca</option>
              <option>Liceo Militar Gral. Espejo</option>
              <option>Liceo Militar Gral. Belgrano</option>
              <option>Liceo Militar Gral. Araoz de Lamadrid</option>
              <option>Liceo Aeronáutico Militar</option>
              <option>Liceo Naval Militar Alte. Brown</option>
              <option>Liceo Naval Militar Alte. Storni</option>
              <option>Liceo Naval Militar Dr. F. de Gurruchaga</option>
              <option>Liceo Naval Militar CF. Moyano</option>
              <option>Ninguno</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:10px">
            <label>Promoción</label>
            <select id="r-promocion" style="background:#fff;color:#111;border:1px solid #74B9FF;border-radius:8px;padding:8px;width:100%;outline:none">
              <option value="">-- Nro --</option>
              <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option><option value="32">32</option><option value="33">33</option><option value="34">34</option><option value="35">35</option><option value="36">36</option><option value="37">37</option><option value="38">38</option><option value="39">39</option><option value="40">40</option><option value="41">41</option><option value="42">42</option><option value="43">43</option><option value="44">44</option><option value="45">45</option><option value="46">46</option><option value="47">47</option><option value="48">48</option><option value="49">49</option><option value="50">50</option><option value="51">51</option><option value="52">52</option><option value="53">53</option><option value="54">54</option><option value="55">55</option><option value="56">56</option><option value="57">57</option><option value="58">58</option><option value="59">59</option><option value="60">60</option><option value="61">61</option><option value="62">62</option><option value="63">63</option><option value="64">64</option><option value="65">65</option><option value="66">66</option><option value="67">67</option><option value="68">68</option><option value="69">69</option><option value="70">70</option><option value="71">71</option><option value="72">72</option><option value="73">73</option><option value="74">74</option><option value="75">75</option><option value="76">76</option><option value="77">77</option><option value="78">78</option><option value="79">79</option><option value="80">80</option><option value="81">81</option><option value="82">82</option><option value="83">83</option><option value="84">84</option><option value="85">85</option><option value="86">86</option><option value="87">87</option>
            </select>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:10px"><label>Nombre y Apellido *</label><input type="text" id="r-nombre" placeholder="Ej: Juan García" style="background:#fff;color:#111;border:1px solid #74B9FF;border-radius:8px;padding:8px;width:100%;outline:none"/></div>
        <div class="form-row">
          <div class="form-group" style="margin-bottom:10px"><label>Teléfono</label><input type="tel" id="r-telefono" placeholder="Ej: 11 5555-5555" style="background:#fff;color:#111;border:1px solid #74B9FF;border-radius:8px;padding:8px;width:100%;outline:none"/></div>
          <div class="form-group" style="margin-bottom:10px"><label>Email</label><input type="email" id="r-email" placeholder="Ej: juan@email.com" style="background:#fff;color:#111;border:1px solid #74B9FF;border-radius:8px;padding:8px;width:100%;outline:none"/></div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button class="btn btn-sm" style="background:transparent;border:1px solid #555;color:#9ca3af" onclick="cancelarEditarRepr()">Cancelar</button>
          <button class="btn btn-primary btn-sm" onclick="guardarRepresentante()">&#128190; Guardar</button>
        </div>
      </div>
      <div id="repr-lista"></div>
      <div id="repr-stats"></div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="xlsx.min.js"></script>
<script src="chart.min.js"></script>
<script src="jspdf.min.js"></script>
<script src="html2canvas.min.js"></script>
<script src="app.js"></script>
</body>
</html>
